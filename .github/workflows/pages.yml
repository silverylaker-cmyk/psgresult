# GitHub Pages 자동 배포
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 설정해야 합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Google TTS 키 (선택): 저장소 Settings → Secrets and variables → Actions → New repository secret → GOOGLE_TTS_KEY
          VITE_GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          VITE_GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          # MP4 서버 주소 (선택): Settings → Secrets and variables → Actions → Variables → SERVER_URL
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
